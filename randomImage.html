<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <title>Random Image Gallery</title>
</head>

<body>
    <template>
        <div class="gallery-item">
            <img class="w-100" width="300" height="300">
        </div>
    </template>
    
        <div class="container-fluid py-5">

            
<div class="controls">
  <label>
    <input type="checkbox" id="blurToggle"> Enable Blur
  </label>

  <label>
    Blur Amount:
    <input type="range" id="blurSlider" min="1" max="10" value="2" disabled>
    <span id="blurValue">2</span>
  </label>

  <label>
    <input type="checkbox" id="grayscaleToggle"> Grayscale
  </label>

  <button type="button" id="loadBtn" class="btn-solid theme-accent">Show new image</button>



</div>



            <form class="py-3">
                <button type="submit" class="btn-solid theme-accent">Show new image</button>
            </form>
            <div
                class="d-grid row-gap-4 column-gap-2"
                style="grid-template-columns: 1fr 1fr 1fr"
                id="image-gallery"
            ></div>
        </div>



    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>

</html>
