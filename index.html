<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Random Image Gallery</title>
</head>

<body>
    <template>
        <div class="gallery-item">
            <img class="w-100" width="300" height="300">
        </div>
    </template>
    <div class="container-fluid py-6">
        <h1>Image Gallery</h1>
        <hr>
        <section class="image-filters">
            <form>
                <div class="d-inline-flex p-2">
                    <label for="blurSlider" class="form-label">Blur Amount</label>
                    <div class="form-range" data-bs-bubble>
                        <input type="range" class="form-range-input" min="0" max="10" value="0" id="blurSlider" disabled>
                    </div>
                </div>
                <div class="form-field">
                    <input type="checkbox" id="blurToggle" class="check" />
                    <label for="blurToggle">Enable Blur</label>
                </div>
                <div class="form-field">
                    <input type="checkbox" id="grayscaleToggle" class="check" />
                    <label for="grayscaleToggle">Grayscale</label>
                </div>
                <div class="mt-2 pt-2">
                    <button type="submit" class="btn-solid theme-accent">Show new image</button>
                </div>
            </form>
        </section>
    
    </div>

    <div class="container-fluid py-5">
        <div class="d-grid row-gap-4 column-gap-2" style="grid-template-columns: 1fr 1fr 1fr" id="image-gallery"></div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>

</html>
